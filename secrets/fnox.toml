# The fleet's secrets, encrypted with age. docs/secrets.md is the runbook.
#
# Each provider is one set of recipients: the admin key plus the SSH host keys
# of the hosts that read its secrets. Values are base64 of the original bytes,
# because fnox trims piped input and cannot store binary.
#
# Without a provider fnox stores a value in plain text; this keeps a forgotten
# --provider to the admin key alone.
default_provider = "admin"

[providers.admin]
type = "age"
recipients = ["age175w5ysy6tncyaelddud60w59hqa2s9ht7p2cezd28pgyy595jp8q2wt0aw"]

[providers.prostagma]
type = "age"
recipients = [
    "age175w5ysy6tncyaelddud60w59hqa2s9ht7p2cezd28pgyy595jp8q2wt0aw",
    "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA+r8NT1FG/Ysn5jehgihrE1KT5r8A+TeZ8bTbovRMTR root@prostagma",
]
