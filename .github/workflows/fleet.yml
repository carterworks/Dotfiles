name: Fleet

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      base:
        description: Commit the update bundle applies to
        type: string
        required: true
      commit:
        description: Commit in the update bundle to build
        type: string
        required: true
    outputs:
      scylla:
        value: ${{ jobs.build.outputs.scylla }}
      prostagma:
        value: ${{ jobs.build.outputs.prostagma }}
      eltoro:
        value: ${{ jobs.build.outputs.eltoro }}

permissions:
  contents: read

# The commit keeps a nightly's build out of the group of a push to main, which
# would otherwise cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.commit }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Only a run for main names the Environment, so a workflow edited on any
    # other branch cannot read its secrets; GitHub also refuses the Environment
    # to other branches.
    environment: ${{ matrix.cache && github.ref == 'refs/heads/main' && 'binary-cache' || '' }}
    # A matrix job's outputs are merged across legs, so each host reports under
    # its own name.
    outputs:
      scylla: ${{ steps.secrets.outputs.scylla || steps.push.outputs.scylla }}
      prostagma: ${{ steps.secrets.outputs.prostagma || steps.push.outputs.prostagma }}
      eltoro: ${{ steps.secrets.outputs.eltoro || steps.push.outputs.eltoro }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scylla
            runner: ubuntu-latest
            target: .#nixosConfigurations.scylla.config.system.build.toplevel
            cache: true
          - name: prostagma
            runner: ubuntu-latest
            target: .#nixosConfigurations.prostagma.config.system.build.toplevel
            cache: true
          - name: eltoro
            runner: ubuntu-latest
            target: .#nixosConfigurations.eltoro.config.system.build.toplevel
            cache: true
          - name: mac
            runner: macos-latest
            target: --impure -f .github/ci.nix mac
          - name: checks-linux
            runner: ubuntu-latest
            target: --impure -f .github/ci.nix checks
          - name: checks-mac
            runner: macos-latest
            target: --impure -f .github/ci.nix checks
    steps:
      - run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.commit
        with:
          name: update
          path: ${{ runner.temp }}
      - name: Check out the update
        if: inputs.commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          git fetch -q "$RUNNER_TEMP/update.bundle"
          git checkout -q --detach "$COMMIT"
      # Nix's installer fetches its tarball once, without retrying, and a
      # runner's network occasionally drops that download.
      - name: Install Nix
        id: nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        continue-on-error: true
        with:
          github_access_token: ${{ github.token }}
      - name: Install Nix, second attempt
        if: steps.nix.outcome == 'failure'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: Use the flake's binary caches
        run: |
          mkdir -p ~/.config/nix
          nix eval --raw --impure -f .github/ci.nix nixConf >> ~/.config/nix/nix.conf
      - name: Build
        run: nix build -L ${{ matrix.target }}
      - name: Check for the binary cache secrets
        id: secrets
        if: matrix.cache && github.ref == 'refs/heads/main'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [[ -n $ATTIC_TOKEN && -n $TS_OAUTH_CLIENT_ID && -n $TS_OAUTH_SECRET ]]; then
            echo present=true >>"$GITHUB_OUTPUT"
          else
            echo "${{ matrix.name }}=skipped" >>"$GITHUB_OUTPUT"
            echo "::notice title=Cache push skipped::The binary-cache Environment has no secrets yet (docs/binary-cache.md), so release does not advance."
          fi
      # The action marks its nodes ephemeral and preauthorised itself; it has
      # no input to change that.
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        id: tailnet
        if: steps.secrets.outputs.present
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: prostagma.dropbear-tortoise.ts.net
      # An unreachable cache leaves the build valid, so the job stays green and
      # only release waits; a push that starts and fails turns the job red.
      - name: Push to the binary cache
        id: push
        if: steps.secrets.outputs.present
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CACHE: http://prostagma.dropbear-tortoise.ts.net:8199
          TAILNET: ${{ steps.tailnet.outcome }}
        run: |
          if [[ $TAILNET != success ]] || ! curl -sS -m 10 -o /dev/null "$CACHE/"; then
            echo "${{ matrix.name }}=unreachable" >>"$GITHUB_OUTPUT"
            echo "::warning title=Cache unreachable::Could not join the tailnet or reach $CACHE; the build is not in the cache, so release does not advance."
            exit 0
          fi
          attic() { nix run --inputs-from . nixpkgs#attic-client -- "$@"; }
          attic login prostagma "$CACHE" "$ATTIC_TOKEN"
          attic push prostagma:fleet ./result
          echo "${{ matrix.name }}=pushed" >>"$GITHUB_OUTPUT"
      - run: df -h
        if: always()

  release:
    needs: build
    # A nightly moves main first and then release itself.
    if: >-
      github.ref == 'refs/heads/main' && !inputs.commit
      && needs.build.outputs.scylla == 'pushed'
      && needs.build.outputs.prostagma == 'pushed'
      && needs.build.outputs.eltoro == 'pushed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Without --force the push only fast-forwards, and creates release if it
      # is missing. A newer run may have moved release past this commit first.
      - run: |
          git push origin "$GITHUB_SHA:refs/heads/release" \
            || { git fetch -q origin release && git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; }
