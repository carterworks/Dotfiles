- defaults:
    link:
      create: true
      force: true
- link:
    ~/.claude/hooks/notify.js: claude/hooks/notify.js
    ~/.claude/rules/context7.md: claude/rules/context7.md
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/statusline.mjs: claude/statusline.mjs
    ~/.config/opencode/cli.json: opencode/cli.json
    ~/.config/opencode/opencode.jsonc: opencode/opencode.jsonc
    ~/.config/opencode/skills/:
      glob: true
      path: agents/skills/*
    ~/.claude/CLAUDE.md: agents/AGENTS.md
    ~/.claude/skills/:
      glob: true
      path: agents/skills/*
    ~/.local/bin/:
      glob: true
      path: bin/*
    ~/.config/git-quick-commit/config.json: git-quick-commit/config.json
    ~/.config/git-quick-commit/PROMPT.md: git-quick-commit/PROMPT.md
    ~/.config/vicinae/settings.json: vicinae-config.jsonc
