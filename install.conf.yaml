- defaults:
    link:
      create: true
      force: true
- link:
    ~/.npmrc: npm/npmrc
    ~/.config/opencode/opencode.jsonc: opencode/opencode.jsonc
    ~/.agents/skills/:
      glob: true
      path: agents/skills/personal/*
    ~/.local/bin/:
      glob: true
      path: bin/*
    ~/.config/vicinae/settings.json: vicinae-config.jsonc
    ~/.config/hypr/:
      glob: true
      path: hypr/*.lua
    ~/.config/quickshell/:
      glob: true
      path: quickshell/*
    ~/.config/quickshell/wallpaper.jpg: assets/wallpapers/01-miasma.jpg
- link:
    ~/.agents/skills/:
      glob: true
      path: agents/skills/generated/*
- link:
    ~/.agents/skills/:
      glob: true
      path: agents/skills/mattpocock/*
