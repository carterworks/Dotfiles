- defaults:
    link:
      create: true
      force: true
- link:
    ~/.npmrc: npm/npmrc
    ~/.config/opencode/cli.json: opencode/cli.json
    ~/.config/opencode/opencode.jsonc: opencode/opencode.jsonc
    ~/.config/herdr/config.toml: herdr/config.toml
    ~/.agents/skills/:
      glob: true
      path: agents/skills/personal/*
    ~/.local/bin/:
      glob: true
      path: bin/*
    ~/.config/vicinae/settings.json: vicinae-config.jsonc
- link:
    ~/.agents/skills/:
      glob: true
      path: agents/skills/generated/*
- link:
    ~/.agents/skills/:
      glob: true
      path: agents/skills/mattpocock/*
